name: Discover Professors (Daily Batch of 5)

on:
  schedule:
    - cron: '0 8 * * *'  # Runs automatically every 24 hours at 08:00 UTC
  workflow_dispatch:      # Allows manual click anytime

jobs:
  run-lead-finder:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Explicit write permission to push commits
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetches complete history so rebase works seamlessly

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas openpyxl

      - name: Run Lead Discovery Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python find_professors.py

      - name: Commit and push updated file back to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add "List of emails.xlsx" "List of emails.xlsx - Sheet1.csv" 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update checked status [skip ci]" && git push origin main)
